{% set name = "kagglehub" %}
{% set version = "1.0.2" %}
{% set ignored_tests = [
  "--ignore=tests/test_kaggle_token_auth.py",
  "--ignore=tests/test_model_upload.py",
  "--ignore=tests/test_dataset_load.py"
] %}
{% set ignored_tests_win = [
  "--ignore=tests/test_http_competition_download.py",
  "--ignore=tests/test_http_dataset_download.py",
  "--ignore=tests/test_http_model_download.py",
  "--ignore=tests/test_logger.py"
] %}

# Missed modules: jwt, model_signing, fastexcel
# E PermissionError: [WinError 32] The process cannot access the file because it is being used by another process
# NotADirectoryError: [WinError 267] The directory name is invalid
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 08abae0c1e249904003ce6f23c189166e3032220478426a552c77c2edb08b93a

build:
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  number: 0
  skip: true  # [py<310]

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - requests
    - tqdm
    - packaging
    - pyyaml
    - kagglesdk >=0.1.22,<1.0
  run_constrained:
    - sigstore >=3.6.1
    - betterproto >=2.0.0b6

test:
  source_files:
    - tests
    - pyproject.toml
  imports:
    - kagglehub
  commands:
    - pip check
    - pytest -v  {{ ignored_tests | join(" ")}}  # [not win]
    - pytest -v  {{ ignored_tests | join(" ")}} {{ ignored_tests_win | join(" ")}}  # [win]
  requires:
    - pip
    - pytest
    - flask
    - polars

about:
  home: https://github.com/Kaggle/kagglehub
  description: |
    KaggleHub is a Python package that provides a simple API to access Kaggle resources anywhere.
  summary: Access Kaggle resources anywhere
  license: Apache-2.0
  license_file: LICENSE
  license_family: Apache
  dev_url: https://github.com/Kaggle/kagglehub
  doc_url: https://github.com/Kaggle/kagglehub/blob/main/README.md

extra:
  recipe-maintainers:
    - ngam
